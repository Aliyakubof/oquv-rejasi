{% load ui %}
<div class="popover popover-kafedra" x-show="ochiq" x-transition x-cloak
     x-data="{ faqatKamomad: false }"
     x-effect="if (ochiq) { $nextTick(() => $refs.qidiruvInput?.focus()); }">
  {% if bulk_mode %}
  <div style="font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:6px;display:flex;align-items:center;gap:5px;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
    <span>Barcha bo'sh guruhlarga biriktirish</span>
  </div>
  {% endif %}
  <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px;">
    <input type="text" x-ref="qidiruvInput" placeholder="O'qituvchi qidirish..." aria-label="O'qituvchi qidirish" x-model="q">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <button type="button" class="chip-btn" :class="faqatKamomad && 'active'" @click="faqatKamomad = !faqatKamomad"
              style="font-size:11px;padding:3px 8px;height:24px;border-radius:12px;">
        <span x-text="faqatKamomad ? '✓ Faqat kamomadli' : 'Faqat kamomadli'"></span>
      </button>
      <span class="credits" style="font-size:11px;">Jami: {{ oqituvchilar|length }} ta</span>
    </div>
  </div>
  <div class="popover-scroll-body" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;">
    {% for profil in oqituvchilar %}
    <button type="button" class="opt"
            x-show="(!faqatKamomad || {{ profil.kamomad|yesno:'true,false' }}) && (q === '' || $el.textContent.toLowerCase().includes(q.toLowerCase()))"
            hx-post="{% url url_nomi fs.pk %}" hx-indicator="#panel-yuk-{{ fs.pk }}"
            {% if bulk_mode %}
            hx-vals='{"oqituvchi": {{ profil.pk }}, "tur": "{{ holat_tur }}"}'
            {% elif slot_guruh %}
            hx-vals='{"oqituvchi": {{ profil.pk }}, "guruh": {{ slot_guruh.pk }}, "tur": "{{ holat_tur }}"}'
            {% else %}
            hx-vals='{"oqituvchi": {{ profil.pk }}}'
            {% endif %}
            hx-target="#panel-{{ fs.pk }}" hx-swap="innerHTML" hx-disabled-elt="this">
      <span class="avatar">{{ profil|stringformat:"s"|bosh_harflar }}</span>
      <span class="opt-info">
        <span class="opt-ism">{{ profil }}</span>
        <span class="opt-lavozim">{{ profil.turi.nomi }}</span>
      </span>
      {% if profil.tolganmi %}
      <span class="menu-soat ok" title="Norma to'liq bajarilgan: {{ profil.jami_soat }}/{{ profil.turi.min_soat }} soat">✓ {{ profil.jami_soat }} s</span>
      {% else %}
      <span class="menu-soat kam" title="Normagacha {{ profil.kamomad }} soat kam">{{ profil.jami_soat }} / {{ profil.turi.min_soat }} (-{{ profil.kamomad }}s)</span>
      {% endif %}
    </button>
    {% empty %}
    <div class="hint" style="padding:8px;">Kafedrada o'qituvchi yo'q</div>
    {% endfor %}
  </div>
</div>
