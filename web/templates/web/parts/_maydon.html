{% if field.field.widget.input_type == "checkbox" %}
<label>{{ field }} {{ label|default:field.label }}</label>
{% elif field.field.widget.input_type == "file" %}
<label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
<div class="file-picker">
  {{ field }}
  <span class="file-picker-btn" aria-hidden="true">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span>Fayl tanlash</span>
  </span>
  <span class="file-picker-name" data-empty="Fayl tanlanmagan">Fayl tanlanmagan</span>
</div>
{% else %}
<label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
{{ field }}
{% endif %}
{% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
{{ field.errors }}
