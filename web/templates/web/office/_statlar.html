<div class="stats" id="statlar" data-jonli="office-statlar" {% if oob %}hx-swap-oob="true" {% endif %}>
  <div class="stat">
    <div class="num">{{ stat.jami_soat }}</div>
    <div class="lbl">Jami yuklama (soat)</div>
  </div>
  <div class="stat">
    <div class="num">{{ jami_talabalar }}</div>
    <div class="lbl">Jami talabalar</div>
  </div>
  {% include "web/parts/_biriktirilmagan_statlar.html" %}
  {% if stat.nomalum_talab_soni %}
  <div class="stat warn">
    <div class="num">{{ stat.nomalum_talab_soni }}</div>
    <div class="lbl">Soni kiritilmagan qatorlar</div>
  </div>
  {% endif %}
</div>
